<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Responsive motion review</title><style>body{margin:0;background:#ddd;font:12px system-ui;color:#333;padding:12px 20px;box-sizing:border-box}p{margin:0 0 8px}iframe{display:block;border:0;transform-origin:top left}#frame{overflow:hidden}</style></head><body><p id="label"></p><div id="frame"><iframe title="Portfolio responsive preview"></iframe></div><script>const params=new URLSearchParams(location.search);const width=params.get('size')==='mobile'?390:1280;const height=params.get('size')==='mobile'?844:720;const route=['/','/about/','/projects/','/posts/'].includes(params.get('route'))?params.get('route'):'/';const iframe=document.querySelector('iframe');iframe.width=width;iframe.height=height;iframe.src=route;document.querySelector('#label').textContent=`${width} × ${height} CSS-pixel viewport · ${route}`;function fit(){const scale=Math.min(1,(innerWidth-40)/width,(innerHeight-60)/height);iframe.style.transform=`scale(${scale})`;document.querySelector('#frame').style.height=`${height*scale}px`;}addEventListener('resize',fit);fit();</script></body></html>
